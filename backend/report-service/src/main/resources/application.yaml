server:
  port: ${REPORT_SERVICE_PORT}

spring:
  application:
    name: report-service
  security:
    oauth2:
      client:
        registration:
          product-service:
            client-id: report-service-client
            client-secret: ${KEYCLOAK_REPORT_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          product-service:
            issuer-uri: ${ISSUER_URI}

s3:
  endpoint: ${S3_ENDPOINT}
  access-key: ${S3_ACCESS}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET}

report-scheduler:
  enabled: ${ENABLED}
  cron: ${CRON}

product-service:
  url: ${PRODUCT_SERVICE_URL}