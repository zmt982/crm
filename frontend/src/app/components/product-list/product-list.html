<div>
  <input type="number" [(ngModel)]="searchId" placeholder="ID товара" />
  <button (click)="loadProduct()">Найти</button>
  <button (click)="product = null">Очистить</button>

  <hr>

  <!-- Если product есть — выводим JSON. Если нет — пишем заглушку -->
  <pre *ngIf="product">{{ product | json }}</pre>
  <p *ngIf="!product">Введите ID и нажмите "Найти"</p>
</div>
